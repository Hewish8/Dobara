{% extends "admin/base.html" %}
{% block title %}My account{% endblock %}
{% block content %}
<h1>My account</h1>
<section class="card" style="max-width:480px">
  <h2>Change password</h2>
  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
  <form method="post" style="display:grid;gap:.75rem">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="field">Current password<input type="password" name="current" required autocomplete="current-password"></label>
    <label class="field">New password (8+ characters)<input type="password" name="new" minlength="8" required autocomplete="new-password"></label>
    <label class="field">Confirm new password<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label>
    <div><button class="btn" type="submit">Change password</button></div>
  </form>
</section>
{% endblock %}
